blueprint:
  name: Light Controller – Exclusive Group
  description: >
    Enforces mutual exclusivity between light controller entities.
    Whenever one controller leaves the "Off" state, every other controller
    in the group is switched to "Off".

    Use for rooms where two lights are alternatives rather than additions,
    e.g. ceiling light and floor lamp. Because the rule sits on the
    controllers themselves it holds for every source - wall switch,
    dashboard, voice assistant or automation.
  domain: automation
  author: deroetzi
  homeassistant:
    min_version: "2024.6.0"

  input:
    controller_entities:
      name: Controller Entities
      description: >
        Two or more input_select controllers that must not be active at the
        same time. Expected states: "On", "Off", optionally "Night".
      selector:
        entity:
          multiple: true
          domain: input_select

    switch_delay:
      name: Switch Delay
      description: >
        Seconds to wait after a controller was switched on before the others
        are switched off. Gives the new light time to actually come up, so
        the room never goes dark in between.
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: s
          mode: box

mode: queued
max: 10
max_exceeded: silent

variables:
  controller_entities: !input controller_entities

trigger:
  - platform: state
    entity_id: !input controller_entities

condition:
  # Nur reagieren, wenn ein Controller eingeschaltet wurde
  - condition: template
    value_template: >
      {{ trigger.to_state.state | lower not in ['off', 'unknown', 'unavailable']
         and trigger.from_state.state != trigger.to_state.state }}

action:
  - alias: Warten bis die neue Leuchte wirklich an ist
    delay:
      seconds: !input switch_delay

  - alias: Alle anderen Controller ausschalten
    action: input_select.select_option
    target:
      entity_id: >
        {{ controller_entities | reject('eq', trigger.entity_id) | list }}
    data:
      option: "Off"

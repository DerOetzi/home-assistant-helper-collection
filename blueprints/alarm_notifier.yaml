blueprint:
  name: Alarm Notifier
  description: >
    Monitors one or more alarm binary sensors (water leak, smoke detector,
    carbon monoxide, gas, etc.) and sends a repeating alert notification until
    the alarm clears or the user acknowledges it.

    Alert: An immediate notification is sent to all persons when any sensor
    triggers ("on"). The notification repeats at the configured interval as
    long as the sensor remains active.

    Announcement (optional): With a TTS engine and media players configured,
    every alert is also spoken on the players with a fixed volume; previous
    volumes are restored afterwards.

    Acknowledge: Tapping the "Alarm quittieren" action in the push notification
    stops further repeats for the current event. Notifications resume
    automatically if the sensor triggers again after having cleared.

    NOTIFICATION ROUTING: Uses the Notify Dispatcher script (alert type –
    always broadcasts to all persons regardless of presence).
  domain: automation
  author: deroetzi
  homeassistant:
    min_version: 2024.6.0
  input:
    alarm_sensors:
      name: Alarm Sensors
      description: >
        One or more binary sensors to monitor. The alarm is considered active
        when at least one sensor reports "on" (OR logic). Suitable for water
        leak, smoke, carbon monoxide, gas, and similar safety sensors.
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    alarm_title:
      name: Notification Title
      description: >
        Title shown in the push notification, e.g. "Wasserleck entdeckt" or
        "Rauchmelder ausgelöst".
      selector:
        text: {}
    alarm_message:
      name: Notification Message
      description: >
        Message body shown in the push notification, e.g. "Lecksensor Küche
        hat ausgelöst".
      selector:
        text: {}
    repeat_interval:
      name: Repeat Interval (minutes)
      description: >
        How often the alert is repeated while the sensor remains active.
        Set to 0 to disable repeat notifications (single alert only – not
        recommended for safety-critical alarms).
      default: 5
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: min
          mode: box
    cancel_action_id:
      name: Acknowledge Action ID
      description: >
        Unique identifier for the "Alarm quittieren" action button in push
        notifications. Must be unique per blueprint instance when multiple
        alarm automations are active (e.g. ALARM_CANCEL_WASSERLECK,
        ALARM_CANCEL_RAUCH).

        The acknowledge can also be triggered from a dashboard button or
        developer tools by firing event_type: mobile_app_notification_action
        with event_data.action set to this value.

        Notifications resume automatically when the sensor triggers again after
        having first cleared.
      default: ALARM_CANCEL
      selector:
        text: {}
    notify_dispatcher:
      name: Notify Dispatcher Script
      description: The Notify Dispatcher script instance used for routing.
      selector:
        entity:
          domain: script
          multiple: false
    announcement:
      name: Announcement
      icon: mdi:bullhorn
      collapsed: true
      input:
        tts_engine:
          name: TTS Engine (optional)
          description: >
            TTS entity for the announcement. Leave empty to disable. The
            announcement is repeated together with every notification.
          default: ""
          selector:
            entity:
              domain: tts
        tts_players:
          name: Media Players
          description: Media players for the announcement.
          default: []
          selector:
            entity:
              domain: media_player
              multiple: true
        tts_volume:
          name: Announcement Volume
          default: 70
          selector:
            number:
              min: 5
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        tts_message:
          name: Announcement Message (optional)
          description: >
            Spoken text. Leave empty to speak the notification title and
            message.
          default: ""
          selector:
            text:
              multiline: true
        tts_duration:
          name: Announcement Duration (seconds)
          description: >
            Time to let the announcement play before the previous volumes are
            restored.
          default: 20
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: s
              mode: box

  source_url: https://raw.githubusercontent.com/DerOetzi/home-assistant-helper-collection/refs/heads/main/blueprints/alarm_notifier.yaml

# The acknowledge event is deliberately not a trigger: with mode restart it
# would abort a running announcement before the volumes are restored. The
# wait_for_trigger steps inside the loop catch it instead.
mode: restart
max_exceeded: silent

variables:
  alarm_sensors: !input alarm_sensors
  alarm_title: !input alarm_title
  alarm_message: !input alarm_message
  repeat_interval: !input repeat_interval
  tts_engine: !input tts_engine
  tts_players: !input tts_players
  tts_volume: !input tts_volume
  tts_message_input: !input tts_message
  tts_message: >-
    {{ tts_message_input if tts_message_input | trim != ''
       else alarm_title ~ '. ' ~ alarm_message }}
  tts_duration: !input tts_duration
  tts_enabled: "{{ tts_engine != '' and tts_players | count > 0 }}"

trigger:
  - id: sensor_triggered
    platform: state
    entity_id: !input alarm_sensors
    to: "on"
  - id: ha_start
    platform: homeassistant
    event: start

action:
  - alias: Check if alarm is still active
    condition: template
    value_template: >
      {{ expand(alarm_sensors)
         | selectattr('state', '==', 'on')
         | list | count > 0 }}

  - alias: Send alert and repeat until alarm clears or is acknowledged
    repeat:
      while:
        - >
          {{ expand(alarm_sensors)
             | selectattr('state', '==', 'on')
             | list | count > 0 }}
      sequence:
        - variables:
            cycle_start: "{{ now().timestamp() }}"

        - alias: Send alert to all persons
          action: script.turn_on
          target:
            entity_id: !input notify_dispatcher
          data:
            variables:
              notify_type: alert
              title: "{{ alarm_title }}"
              message: "{{ alarm_message }}"
              reminder_count: "{{ repeat.index - 1 }}"
              extra_data:
                actions:
                  - action: !input cancel_action_id
                    title: Alarm quittieren

        - alias: Announce on media players
          if: "{{ tts_enabled }}"
          then:
            - variables:
                previous_volumes: >-
                  {%- set ns = namespace(v={}) -%}
                  {%- for p in tts_players -%}
                    {%- set ns.v = dict(ns.v, **{p: state_attr(p, 'volume_level')}) -%}
                  {%- endfor -%}
                  {{ ns.v }}
            - action: media_player.volume_set
              target:
                entity_id: "{{ tts_players }}"
              data:
                volume_level: "{{ tts_volume / 100 }}"
              continue_on_error: true
            - action: tts.speak
              target:
                entity_id: "{{ tts_engine }}"
              data:
                media_player_entity_id: "{{ tts_players }}"
                message: "{{ tts_message }}"
                cache: true
              continue_on_error: true
            - alias: Let the announcement play, but keep listening for acknowledge
              wait_for_trigger:
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: !input cancel_action_id
              timeout:
                seconds: "{{ tts_duration }}"
            - variables:
                acknowledged_during_tts: "{{ wait.trigger is not none }}"
            - repeat:
                for_each: "{{ tts_players }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ previous_volumes[repeat.item] is number }}"
                    then:
                      - action: media_player.volume_set
                        target:
                          entity_id: "{{ repeat.item }}"
                        data:
                          volume_level: "{{ previous_volumes[repeat.item] }}"
                        continue_on_error: true
            - if: "{{ acknowledged_during_tts }}"
              then:
                - stop: "Alarm acknowledged by user"

        - alias: Stop if repeat is disabled
          if: "{{ repeat_interval | int(0) == 0 }}"
          then:
            - stop: "Single alert sent, repeat disabled"

        - alias: Wait for alarm to clear, acknowledge, or interval to elapse
          wait_for_trigger:
            - alias: Alarm cleared
              platform: template
              value_template: >
                {{ expand(alarm_sensors)
                   | selectattr('state', '==', 'on')
                   | list | count == 0 }}
            - alias: Acknowledged via mobile action
              platform: event
              event_type: mobile_app_notification_action
              event_data:
                action: !input cancel_action_id
          # The announcement counts into the interval, so the rhythm stays
          # at repeat_interval.
          timeout:
            seconds: >-
              {{ [repeat_interval * 60
                  - (now().timestamp() - cycle_start | float), 1] | max | int }}

        - alias: Stop loop if alarm cleared or acknowledged
          if: "{{ wait.trigger is not none }}"
          then:
            - stop: "Alarm cleared or acknowledged"

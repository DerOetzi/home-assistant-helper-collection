blueprint:
  name: Legionella Protection Schedule
  description: >
    Fires a water heater into a high-temperature operation mode (e.g.
    "performance") at a fixed weekly time, but only when both:

    - the water heater is not switched off, and
    - a PV forecast sensor is above or below a configurable threshold
      (whichever direction fits the time of day — e.g. run at night only on
      a poor-forecast day, or at midday only on a good-forecast day, to
      prefer solar surplus for the legionella-protection heating cycle when
      available).

    Fallback slot (optional, recommended): with a fallback time set, a
    single instance covers the whole week. The cycle starts at the trigger
    time when the forecast condition holds, otherwise at the later fallback
    time regardless of the forecast — e.g. 13:00 on PV, else 15:00 (warmest
    part of the day, and the hot water is used in the evening instead of
    standing overnight). A forecast that changes during the day can no
    longer skip the cycle; to rule out a second run as well, set the last
    start helper. The fallback time has to be later than the trigger time.

    Last start helper (optional, recommended with the fallback slot): an
    input_datetime (date and time) that receives the time of every
    successful start. Further starts on the same day are skipped, and no
    "could not be started" notification is sent. Without it, a second start
    is only prevented while the outlet is still close to the disinfection
    temperature (outlet threshold minus 3 K).

    Without a fallback, instantiate this blueprint twice for a night/day
    pair: once with `comparison: below` for an early/night slot and once
    with `comparison: above` for a midday slot. Both read the forecast at
    different times, so a changing forecast can skip both or run both.

    Retries: if switching the mode fails (e.g. the manufacturer cloud is
    unreachable), the start is retried every 15 minutes within the retry
    window. A start is skipped while the outlet temperature is already close
    to the disinfection temperature (outlet threshold minus 3 K), so a cycle
    that just finished does not run again.

    Verification (optional): after a successful start the automation waits
    until the outlet sensor (or the water heater's current_temperature) has
    reached the outlet threshold and, if a circulation return sensor is set,
    the return has reached the return threshold and stayed there for the
    hold time.

    Circulation request (optional): an input_boolean that is switched on
    after a successful start, so the circulation controller runs the pump
    continuously. Switching it off once the loop is disinfected is up to the
    circulation controller (e.g. "Release Continuous Run When Hot" in the
    thermostatic circulation blueprint). This automation only switches it
    off when the verification fails, so the pump never stays in continuous
    mode after a failed cycle.

    Notification (optional): a push message is sent when the cycle could not
    be started within the retry window, or when the verification fails.
  domain: automation
  author: deroetzi
  homeassistant:
    min_version: 2025.4.0
  input:
    actor:
      name: Water Heater
      icon: mdi:water-boiler
      input:
        water_heater:
          name: Water Heater
          selector:
            entity:
              domain: water_heater
        performance_mode:
          name: High-Temperature Operation Mode
          description: Operation mode value to set for the legionella-protection cycle.
          default: performance
          selector:
            text: {}
    schedule:
      name: Schedule
      icon: mdi:clock-outline
      input:
        trigger_time:
          name: Trigger Time
          selector:
            time: {}
        weekday:
          name: Weekday(s)
          default:
            - tue
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        retry_window:
          name: Retry Window
          description: >
            Minutes after the trigger time (and after the fallback time, if
            enabled) in which a failed start is retried every 15 minutes. When
            the last window has passed without a start, a notification is sent.
          default: 120
          selector:
            number:
              min: 15
              max: 600
              unit_of_measurement: min
              mode: box
        fallback_enabled:
          name: Fallback Slot
          description: >
            Start at the fallback time regardless of the forecast when the
            cycle did not start at the trigger time.
          default: false
          selector:
            boolean: {}
        fallback_time:
          name: Fallback Time
          description: Later than the trigger time. Only used with the fallback slot enabled.
          default: "15:00:00"
          selector:
            time: {}
        last_start_helper:
          name: Last Start Helper (optional)
          description: >
            input_datetime with date and time. Stores the last successful
            start; a cycle runs at most once per day. Leave empty to disable.
          default: ""
          selector:
            entity:
              domain: input_datetime
        circulation_request:
          name: Circulation Request (optional)
          description: >
            input_boolean switched on after a successful start to request
            continuous circulation. Leave empty to disable.
          default: ""
          selector:
            entity:
              domain: input_boolean
    forecast_gate:
      name: Forecast Gate
      icon: mdi:weather-sunny
      input:
        forecast_sensor:
          name: PV Forecast Sensor
          selector:
            entity:
              domain: sensor
              device_class: energy
        threshold:
          name: Forecast Threshold
          default: 30
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: kWh
              mode: box
        comparison:
          name: Comparison
          description: Run only when the forecast is above, or below, the threshold.
          default: above
          selector:
            select:
              options:
                - label: Above threshold
                  value: above
                - label: Below threshold
                  value: below
    verification:
      name: Verification
      icon: mdi:thermometer-check
      collapsed: true
      input:
        outlet_sensor:
          name: Outlet Temperature Sensor (optional)
          description: >
            Hot water outlet or tank temperature. Leave empty to use the water
            heater's current_temperature attribute.
          default: ""
          selector:
            entity:
              domain: sensor
        outlet_threshold:
          name: Outlet Threshold
          default: 60
          selector:
            number:
              min: 50
              max: 80
              unit_of_measurement: °C
              mode: box
        return_sensor:
          name: Circulation Return Sensor (optional)
          description: Leave empty to skip the circulation check.
          default: ""
          selector:
            entity:
              domain: sensor
        return_threshold:
          name: Return Threshold
          default: 55
          selector:
            number:
              min: 45
              max: 75
              unit_of_measurement: °C
              mode: box
        hold_time:
          name: Hold Time
          description: How long the return has to stay above its threshold.
          default: 5
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: min
              mode: box
        verify_timeout:
          name: Verification Timeout
          description: Maximum time from the start until both thresholds are reached.
          default: 240
          selector:
            number:
              min: 30
              max: 720
              unit_of_measurement: min
              mode: box
    notification:
      name: Notification
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_service:
          name: Notify Service (optional)
          description: >
            Notify service for push messages, e.g. notify.mobile_app_phone.
            Leave empty to disable notifications.
          default: ""
          selector:
            text: {}

  source_url: https://raw.githubusercontent.com/DerOetzi/home-assistant-helper-collection/refs/heads/main/blueprints/legionella_protection_schedule.yaml

# single: a running cycle (verification can take hours) silently blocks the
# retry and deadline triggers, so a started cycle is never started twice.
mode: single
max_exceeded: silent

trigger_variables:
  trigger_time: !input trigger_time
  weekdays: !input weekday
  retry_window: !input retry_window
  fallback_enabled: !input fallback_enabled
  fallback_time: !input fallback_time

variables:
  water_heater: !input water_heater
  performance_mode: !input performance_mode
  comparison: !input comparison
  forecast_sensor: !input forecast_sensor
  threshold: !input threshold
  outlet_sensor: !input outlet_sensor
  outlet_threshold: !input outlet_threshold
  return_sensor: !input return_sensor
  return_threshold: !input return_threshold
  hold_time: !input hold_time
  verify_timeout: !input verify_timeout
  notify_service: !input notify_service
  outlet_temp: >-
    {{ (states(outlet_sensor) if outlet_sensor else
        state_attr(water_heater, 'current_temperature')) | float(0) }}
  already_hot: "{{ outlet_temp >= outlet_threshold - 3 }}"
  last_start_helper: !input last_start_helper
  circulation_request: !input circulation_request
  started_today: >-
    {{ last_start_helper != ''
       and states(last_start_helper)[:10] == now().strftime('%Y-%m-%d') }}

triggers:
  - id: start
    trigger: time
    at: !input trigger_time
  - id: start
    trigger: time
    at: !input fallback_time
    enabled: !input fallback_enabled
  # Every 15 minutes inside a retry window, only on the scheduled weekdays
  # (keeps the trace list free of runs that would fail their conditions).
  - id: retry
    trigger: template
    value_template: >-
      {% set p = today_at(trigger_time) %}
      {% set f = today_at(fallback_time) %}
      {% set w = timedelta(minutes=retry_window) %}
      {{ now().strftime('%a') | lower in weekdays
         and now().minute % 15 == 0
         and ((p < now() <= p + w)
              or (fallback_enabled and f < now() <= f + w)) }}
  # After the last window: the fallback window if enabled, else the first.
  - id: deadline
    trigger: template
    value_template: >-
      {% set last = today_at(fallback_time) if fallback_enabled else today_at(trigger_time) %}
      {{ now().strftime('%a') | lower in weekdays
         and now() >= last + timedelta(minutes=retry_window + 5) }}

conditions:
  - condition: time
    weekday: !input weekday
  - condition: not
    conditions:
      - condition: state
        entity_id: !input water_heater
        state: "off"
  # Forecast gate; from the fallback time on it no longer applies. A cycle
  # that already ran is caught by started_today / already_hot in the actions.
  - condition: template
    value_template: >-
      {% set val = states(forecast_sensor) | float(0) %}
      {{ (val > threshold if comparison == 'above' else val < threshold)
         or (fallback_enabled and now() >= today_at(fallback_time)) }}

actions:
  - choose:
      - alias: Deadline passed without a cycle
        conditions:
          - condition: trigger
            id: deadline
          - condition: template
            value_template: "{{ not already_hot and not started_today }}"
          - condition: template
            value_template: "{{ notify_service != '' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              title: Legionellenschutz ausgefallen
              message: >-
                Die Warmwasser-Desinfektion konnte im Zeitfenster nicht
                gestartet werden (Warmwasser {{ outlet_temp | round(1) }} °C).
                Bitte von Hand nachholen.

      - alias: Start or retry the cycle
        conditions:
          - condition: trigger
            id:
              - start
              - retry
          - condition: template
            value_template: "{{ not already_hot and not started_today }}"
          - condition: template
            value_template: "{{ not is_state(water_heater, performance_mode) }}"
        sequence:
          # A failing call (e.g. cloud unreachable) ends the run here; the
          # next retry trigger tries again.
          - action: water_heater.set_operation_mode
            target:
              entity_id: !input water_heater
            data:
              operation_mode: !input performance_mode
          - wait_template: "{{ is_state(water_heater, performance_mode) }}"
            timeout:
              minutes: 5
            continue_on_timeout: false
          - if:
              - condition: template
                value_template: "{{ last_start_helper != '' }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "{{ last_start_helper }}"
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - if:
              - condition: template
                value_template: "{{ circulation_request != '' }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ circulation_request }}"

          - alias: Wait for the outlet temperature
            wait_template: >-
              {{ (states(outlet_sensor) if outlet_sensor else
                  state_attr(water_heater, 'current_temperature')) | float(0)
                 >= outlet_threshold }}
            timeout:
              minutes: "{{ verify_timeout }}"
          - variables:
              outlet_ok: "{{ wait.completed }}"
              return_ok: true
          - if:
              - condition: template
                value_template: "{{ outlet_ok and return_sensor != '' }}"
            then:
              - alias: Wait for the circulation return temperature
                wait_template: "{{ states(return_sensor) | float(0) >= return_threshold }}"
                timeout:
                  minutes: "{{ verify_timeout }}"
              - if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - delay:
                      minutes: "{{ hold_time }}"
                  - variables:
                      return_ok: "{{ states(return_sensor) | float(0) >= return_threshold }}"
                else:
                  - variables:
                      return_ok: false

          - alias: Failed cycle - end the circulation request
            if:
              - condition: template
                value_template: "{{ not (outlet_ok and return_ok) and circulation_request != '' }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ circulation_request }}"
          - if:
              - condition: template
                value_template: "{{ not (outlet_ok and return_ok) and notify_service != '' }}"
            then:
              - action: "{{ notify_service }}"
                data:
                  title: Legionellenschutz unvollständig
                  message: >-
                    {% set o = (states(outlet_sensor) if outlet_sensor else
                        state_attr(water_heater, 'current_temperature')) | float(0) %}
                    {% if not outlet_ok %}Warmwasser hat {{ outlet_threshold }} °C
                    nicht erreicht ({{ o | round(1) }} °C).{% else %}Zirkulationsrücklauf
                    hat {{ return_threshold }} °C nicht {{ hold_time }} min gehalten
                    ({{ states(return_sensor) | float(0) | round(1) }} °C).{% endif %}

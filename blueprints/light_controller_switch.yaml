blueprint:
  name: Light Controller – Switch
  description: >
    Controls non-dimmable lights (switch domain) based on an input_select or
    select entity state. Counterpart to the dimmable light controller for
    rooms whose lights are plain relays.
    Expects controller states: "On" and "Off". State names are case-insensitive.
  domain: automation
  author: deroetzi
  homeassistant:
    min_version: "2024.6.0"

  input:
    controller_entity:
      name: Controller Entity
      description: >
        input_select or select entity that controls the switches.
        Expected states: "On" and "Off". State names are case-insensitive.
      selector:
        entity:
          domain:
            - input_select
            - select

    switch_entities:
      name: Switch Entities
      description: One or more switch entities to control
      selector:
        entity:
          multiple: true
          domain: switch

mode: restart
max_exceeded: silent

variables:
  controller_entity: !input controller_entity
  switch_entities: !input switch_entities
  requested: "{{ trigger.event.data.service_data.option | lower }}"

trigger:
  # Triggers on the service call itself, not on the state change: pressing the
  # already selected option (dashboard or wall switch) changes no state but
  # must still repeat the command, e.g. "Off" again when the light is on
  # despite the controller showing Off.
  # Websocket/script calls pass entity_id as a list, so match both forms.
  # Calls targeting several controllers at once are NOT matched: always call
  # select_option with exactly one controller entity.
  - platform: event
    event_type: call_service
    event_data:
      service: select_option
      service_data:
        entity_id:
          - !input controller_entity
  - platform: event
    event_type: call_service
    event_data:
      service: select_option
      service_data:
        entity_id: !input controller_entity

action:
  - alias: Handle controller state
    choose:
      # ON State
      - conditions:
          - condition: template
            value_template: >
              {{ requested in ['on'] }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input switch_entities

      # OFF State
      - conditions:
          - condition: template
            value_template: >
              {{ requested in ['off'] }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input switch_entities

    default:
      - alias: Log unknown controller state
        action: system_log.write
        data:
          message: >
            Light Controller Switch: Unknown state '{{ requested }}'
            from controller '{{ controller_entity }}'.
            Expected states: On, Off.
          level: warning
